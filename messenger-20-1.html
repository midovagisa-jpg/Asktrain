<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FitChat</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;font-family:'Inter',sans-serif;color:#e2e8f0;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:rgba(180,50,200,0.3);border-radius:2px;}

/* ANIMATED BG */
.bg{position:fixed;inset:0;z-index:0;background:#0d0010;overflow:hidden;}
.orb{position:absolute;border-radius:50%;pointer-events:none;filter:blur(60px);}
.orb1{width:700px;height:700px;background:radial-gradient(circle,rgba(180,0,255,0.25)0%,transparent 70%);animation:o1 9s ease-in-out infinite;top:-200px;left:-200px;}
.orb2{width:600px;height:600px;background:radial-gradient(circle,rgba(220,0,80,0.2)0%,transparent 70%);animation:o2 11s ease-in-out infinite;bottom:-150px;right:-150px;}
.orb3{width:500px;height:500px;background:radial-gradient(circle,rgba(100,0,180,0.15)0%,transparent 70%);animation:o3 13s ease-in-out infinite;top:40%;left:30%;}
@keyframes o1{0%,100%{transform:translate(0,0)}33%{transform:translate(120px,80px)}66%{transform:translate(60px,160px)}}
@keyframes o2{0%,100%{transform:translate(0,0)}33%{transform:translate(-100px,-70px)}66%{transform:translate(-50px,-140px)}}
@keyframes o3{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-40%,-60%) scale(1.3)}}
.bg-noise{position:fixed;inset:0;z-index:0;opacity:0.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");pointer-events:none;}

.screen{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;}
.screen.active{display:flex;}

/* LOGIN */
#loginScreen{align-items:center;justify-content:center;padding:24px;background:rgba(13,0,16,0.95);backdrop-filter:blur(20px);}
.login-card{width:100%;max-width:340px;background:rgba(255,255,255,0.04);border:1px solid rgba(180,50,200,0.25);border-radius:24px;padding:32px 24px;display:flex;flex-direction:column;align-items:center;gap:18px;}
.app-logo{width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,#9b00ff,#ff0055);display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 0 40px rgba(155,0,255,0.5);}
.app-name{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;background:linear-gradient(135deg,#d87bff,#ff6b9d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.app-tagline{font-size:13px;color:rgba(255,255,255,0.4);text-align:center;}
.inp{width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:14px;color:#e2e8f0;padding:13px 18px;font-size:15px;font-family:'Inter',sans-serif;transition:all 0.2s;}
.inp:focus{outline:none;border-color:rgba(155,0,255,0.5);background:rgba(255,255,255,0.08);}
.inp::placeholder{color:rgba(255,255,255,0.25);}
.btn{width:100%;background:linear-gradient(135deg,#9b00ff,#ff0055);border:none;border-radius:14px;color:white;padding:14px;font-size:15px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;box-shadow:0 4px 20px rgba(155,0,255,0.4);transition:all 0.2s;}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 25px rgba(155,0,255,0.5);}
.err{font-size:12px;color:#f87171;min-height:16px;}

/* BOTTOM NAV */
.bottom-nav{display:flex;background:rgba(13,0,16,0.95);backdrop-filter:blur(20px);border-top:1px solid rgba(180,50,200,0.15);flex-shrink:0;z-index:5;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 0;cursor:pointer;gap:3px;transition:all 0.2s;position:relative;}
.nav-item.active .nav-icon{color:#d87bff;}
.nav-item.active .nav-label{color:#d87bff;}
.nav-icon{font-size:20px;color:rgba(255,255,255,0.35);transition:all 0.2s;}
.nav-label{font-size:10px;color:rgba(255,255,255,0.3);font-weight:500;transition:all 0.2s;}
.nav-badge{position:absolute;top:6px;right:calc(50% - 14px);background:linear-gradient(135deg,#9b00ff,#ff0055);color:white;font-size:9px;font-weight:700;border-radius:10px;padding:1px 5px;min-width:16px;text-align:center;}

/* TOP BAR */
.top-bar{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;background:rgba(13,0,16,0.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(180,50,200,0.15);flex-shrink:0;z-index:1;}
.top-bar-title{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;background:linear-gradient(135deg,#d87bff,#ff6b9d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.shimmer{height:2px;background:linear-gradient(90deg,transparent,#9b00ff,#ff0055,#d87bff,transparent);background-size:200% 100%;animation:shimmer 3s linear infinite;flex-shrink:0;}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid rgba(180,50,200,0.25);background:rgba(180,50,200,0.1);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:all 0.2s;}
.icon-btn:hover{background:rgba(180,50,200,0.2);}

/* CHATS */
.search-bar{padding:10px 14px;background:rgba(13,0,16,0.6);flex-shrink:0;}
.search-inp{width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:12px;color:#e2e8f0;padding:9px 14px;font-size:14px;font-family:'Inter',sans-serif;}
.search-inp:focus{outline:none;border-color:rgba(155,0,255,0.4);}
.search-inp::placeholder{color:rgba(255,255,255,0.2);}
.tabs{display:flex;padding:0 14px;gap:4px;background:rgba(13,0,16,0.6);flex-shrink:0;}
.tab{padding:10px 14px;font-size:13px;font-weight:500;color:rgba(255,255,255,0.4);cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s;}
.tab.active{color:#d87bff;border-bottom-color:#d87bff;}
.list{flex:1;overflow-y:auto;}
.chat-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,0.04);cursor:pointer;transition:background 0.15s;}
.chat-item:hover{background:rgba(255,255,255,0.03);}
.chat-avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:white;flex-shrink:0;position:relative;}
.chat-avatar.group{border-radius:14px;}
.online-ring{position:absolute;bottom:1px;right:1px;width:12px;height:12px;border-radius:50%;border:2px solid #0d0010;}
.online-ring.online{background:#4ade80;}
.online-ring.away{background:#fbbf24;}
.chat-info{flex:1;min-width:0;}
.chat-name{font-weight:600;font-size:15px;color:#e2e8f0;}
.chat-last{font-size:13px;color:rgba(255,255,255,0.4);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chat-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.chat-time{font-size:11px;color:rgba(255,255,255,0.3);}
.unread-badge{background:linear-gradient(135deg,#9b00ff,#ff0055);color:white;font-size:11px;font-weight:700;border-radius:10px;padding:2px 7px;}
.fab{position:absolute;bottom:80px;right:20px;width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,#9b00ff,#ff0055);border:none;color:white;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(155,0,255,0.5);transition:all 0.2s;z-index:5;}
.fab:hover{transform:scale(1.08);}
.empty-list{text-align:center;padding:60px 24px;color:rgba(255,255,255,0.25);font-size:14px;}

/* CHAT */
.chat-header{padding:12px 16px;display:flex;align-items:center;gap:12px;background:rgba(13,0,16,0.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(180,50,200,0.15);flex-shrink:0;}
.back-btn{width:34px;height:34px;border-radius:10px;border:none;background:rgba(255,255,255,0.06);color:#d87bff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.chat-header-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:white;flex-shrink:0;}
.chat-header-avatar.group{border-radius:12px;}
.chat-header-info{flex:1;}
.chat-header-name{font-weight:600;font-size:15px;}
.chat-header-status{font-size:11px;color:rgba(255,255,255,0.4);margin-top:1px;}
.messages{flex:1;overflow-y:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:4px;}
.msg-group{display:flex;flex-direction:column;gap:2px;margin-bottom:8px;}
.msg-group.mine{align-items:flex-end;}
.msg-sender{font-size:11px;font-weight:600;margin-bottom:2px;padding:0 4px;}
.msg-row{display:flex;align-items:flex-end;gap:6px;}
.msg-group.mine .msg-row{flex-direction:row-reverse;}
.msg-avatar-small{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:white;flex-shrink:0;}
.bubble{max-width:75%;padding:9px 13px;font-size:14px;line-height:1.55;word-break:break-word;}
.msg-group:not(.mine) .bubble{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:4px 14px 14px 14px;color:#e2e8f0;animation:fromLeft 0.45s cubic-bezier(0.34,1.56,0.64,1) both;}
.msg-group.mine .bubble{background:linear-gradient(135deg,rgba(155,0,255,0.4),rgba(255,0,85,0.3));border:1px solid rgba(180,50,200,0.35);border-radius:14px 4px 14px 14px;color:#e2e8f0;animation:fromRight 0.45s cubic-bezier(0.34,1.56,0.64,1) both;}
@keyframes fromLeft{from{opacity:0;transform:translateX(-20px) scale(0.88);}to{opacity:1;transform:translateX(0) scale(1);}}
@keyframes fromRight{from{opacity:0;transform:translateX(20px) scale(0.88);}to{opacity:1;transform:translateX(0) scale(1);}}
.msg-time-small{font-size:10px;color:rgba(255,255,255,0.25);padding:0 4px;align-self:flex-end;white-space:nowrap;}
.date-divider{text-align:center;font-size:11px;color:rgba(255,255,255,0.25);padding:8px 0;}
.input-wrap{padding:10px 12px;background:rgba(13,0,16,0.9);backdrop-filter:blur(20px);border-top:1px solid rgba(180,50,200,0.12);display:flex;gap:8px;align-items:flex-end;flex-shrink:0;}
.msg-input{flex:1;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:14px;color:#e2e8f0;padding:10px 14px;font-size:14px;font-family:'Inter',sans-serif;resize:none;max-height:100px;line-height:1.5;transition:all 0.2s;}
.msg-input:focus{outline:none;border-color:rgba(155,0,255,0.5);}
.msg-input::placeholder{color:rgba(255,255,255,0.25);}
.send-btn{width:40px;height:40px;border-radius:12px;border:none;color:white;font-size:16px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#9b00ff,#ff0055,#d87bff,#ff0055,#9b00ff);background-size:300% 300%;animation:gradMove 4s ease infinite;box-shadow:0 4px 15px rgba(155,0,255,0.4);transition:transform 0.2s;}
.send-btn:hover{transform:scale(1.08);}
@keyframes gradMove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

/* POSTS */
.post-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:16px;margin:10px 14px;animation:fromLeft 0.4s cubic-bezier(0.34,1.56,0.64,1) both;}
.post-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.post-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:white;flex-shrink:0;}
.post-nick{font-weight:600;font-size:14px;}
.post-time{font-size:11px;color:rgba(255,255,255,0.3);}
.post-text{font-size:14px;line-height:1.65;color:#d4d4d4;margin-bottom:12px;}
.post-actions{display:flex;gap:16px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.06);}
.post-action{display:flex;align-items:center;gap:5px;font-size:13px;color:rgba(255,255,255,0.4);cursor:pointer;transition:color 0.2s;}
.post-action:hover{color:#d87bff;}
.post-action.liked{color:#ff6b9d;}
.post-comments{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.06);}
.comment{display:flex;gap:8px;margin-bottom:8px;}
.comment-bubble{background:rgba(255,255,255,0.04);border-radius:10px;padding:8px 12px;flex:1;font-size:13px;}
.comment-nick{font-weight:600;font-size:11px;color:#d87bff;margin-bottom:2px;}
.comment-input-wrap{display:flex;gap:8px;margin-top:8px;}
.comment-inp{flex:1;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;padding:8px 12px;font-size:13px;font-family:'Inter',sans-serif;}
.comment-inp:focus{outline:none;border-color:rgba(155,0,255,0.4);}
.small-send{width:32px;height:32px;border-radius:8px;border:none;background:linear-gradient(135deg,#9b00ff,#ff0055);color:white;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}

/* PROFILE */
.profile-wrap{flex:1;overflow-y:auto;padding:20px 16px;}
.profile-card{background:rgba(255,255,255,0.04);border:1px solid rgba(180,50,200,0.2);border-radius:20px;padding:24px;margin-bottom:16px;text-align:center;}
.profile-big-avatar{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;color:white;margin:0 auto 12px;box-shadow:0 0 30px rgba(155,0,255,0.4);}
.profile-name{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;background:linear-gradient(135deg,#d87bff,#ff6b9d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.profile-bio{font-size:13px;color:rgba(255,255,255,0.45);margin-top:6px;}
.profile-section{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:16px;margin-bottom:12px;}
.profile-section-title{font-size:12px;color:rgba(255,255,255,0.3);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:12px;}
.profile-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05);cursor:pointer;}
.profile-row:last-child{border-bottom:none;}
.profile-row-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.profile-row-text{flex:1;font-size:14px;}
.profile-row-sub{font-size:12px;color:rgba(255,255,255,0.4);margin-top:1px;}

/* AI PANEL */
.ai-panel{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(13,0,16,0.97);backdrop-filter:blur(20px);border-top:1px solid rgba(180,50,200,0.2);padding:16px;transform:translateY(100%);transition:transform 0.3s cubic-bezier(0.34,1.2,0.64,1);max-height:70vh;overflow-y:auto;}
.ai-panel.open{transform:translateY(0);}
.ai-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.ai-title{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;background:linear-gradient(135deg,#d87bff,#ff6b9d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.ai-limit{font-size:11px;color:rgba(255,255,255,0.3);font-family:'DM Mono',monospace;}
.ai-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.ai-chip{background:rgba(155,0,255,0.1);border:1px solid rgba(155,0,255,0.25);border-radius:20px;padding:6px 12px;font-size:12px;cursor:pointer;transition:all 0.2s;}
.ai-chip:hover{background:rgba(155,0,255,0.2);}
.ai-messages{max-height:200px;overflow-y:auto;margin-bottom:12px;display:flex;flex-direction:column;gap:8px;}
.ai-msg{padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.6;}
.ai-msg.user{background:rgba(155,0,255,0.15);border:1px solid rgba(155,0,255,0.25);align-self:flex-end;max-width:85%;}
.ai-msg.ai{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);max-width:95%;}
.ai-input-wrap{display:flex;gap:8px;}
.ai-inp{flex:1;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;color:#e2e8f0;padding:10px 14px;font-size:14px;font-family:'Inter',sans-serif;}
.ai-inp:focus{outline:none;border-color:rgba(155,0,255,0.4);}
.ai-send-btn{width:40px;height:40px;border-radius:12px;border:none;background:linear-gradient(135deg,#9b00ff,#ff0055);color:white;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.ai-send-to-chat{width:100%;margin-top:8px;padding:10px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:10px;color:#d87bff;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.2s;}
.ai-send-to-chat:hover{background:rgba(155,0,255,0.1);}

/* MODAL */
.modal-overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);display:none;align-items:flex-end;}
.modal-overlay.open{display:flex;}
.modal{width:100%;background:#12001a;border-radius:24px 24px 0 0;border-top:1px solid rgba(180,50,200,0.25);padding:20px;max-height:80vh;overflow-y:auto;animation:slideUp 0.3s cubic-bezier(0.34,1.2,0.64,1);}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-title{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:600;color:#d87bff;margin-bottom:16px;}
.modal-option{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;cursor:pointer;transition:background 0.15s;margin-bottom:8px;}
.modal-option:hover{background:rgba(255,255,255,0.05);}
.modal-option-icon{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;}
.member-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;transition:background 0.15s;}
.member-item:hover{background:rgba(255,255,255,0.04);}
.remove-btn{margin-left:auto;background:rgba(220,50,50,0.15);border:1px solid rgba(220,50,50,0.25);color:#f87171;border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;}
.add-wrap{display:flex;gap:8px;margin-top:10px;}
.small-btn{background:linear-gradient(135deg,#9b00ff,#ff0055);border:none;border-radius:10px;color:white;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;}

/* PARTICLES */
.particle{position:fixed;border-radius:50%;pointer-events:none;z-index:999;animation:pFly 0.7s ease-out forwards;}
@keyframes pFly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0)}}

.online-dot{width:8px;height:8px;border-radius:50%;background:#4ade80;display:inline-block;margin-right:4px;animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.4}}
</style>
</head>
<body>
<div class="bg"><div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div></div>
<div class="bg-noise"></div>

<!-- LOGIN -->
<div id="loginScreen" class="screen active">
  <div class="login-card">
    <div class="app-logo">💬</div>
    <div class="app-name">FitChat</div>
    <div class="app-tagline">Войди по никнейму и начни общаться</div>
    <input class="inp" id="nickInp" type="text" placeholder="Никнейм..." maxlength="20" onkeydown="if(event.key==='Enter')login()">
    <input class="inp" id="bioInp" type="text" placeholder="О себе (необязательно)..." maxlength="80">
    <button class="btn" onclick="login()">Войти ⚡</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- CHATS SCREEN -->
<div id="chatsScreen" class="screen">
  <div class="top-bar">
    <div class="top-bar-title">💬 FitChat</div>
    <div style="display:flex;gap:8px;">
      <div class="icon-btn" onclick="openNewChat()">✏️</div>
    </div>
  </div>
  <div class="shimmer"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onValue, set, get, remove, serverTimestamp, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyADCa1uZpA-rhtmnNcf96UaBxqcY7lDL3M",
  authDomain: "fitchat-6d903.firebaseapp.com",
  databaseURL: "https://fitchat-6d903-default-rtdb.firebaseio.com",
  projectId: "fitchat-6d903",
  storageBucket: "fitchat-6d903.firebasestorage.app",
  messagingSenderId: "1060135785203",
  appId: "1:1060135785203:web:ca4123d7d551ee22889d86"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const COLORS = ['#9b00ff','#ff0055','#0088ff','#00cc88','#ff8800','#ff44aa','#00bbff'];
const ADMIN_NICK = 'Midov Gisa';
function getColor(s){let h=0;for(let c of s)h=Math.imul(31,h)+c.charCodeAt(0)|0;return COLORS[Math.abs(h)%COLORS.length];}

let myNick='', myBio='', currentChat=null, currentChatType='', currentTab='all', allChats=[], lastAIResponse='', aiRequests=0;
const AI_LIMIT = 15;

// LOGIN
window.login = function(){
  const nick = document.getElementById('nickInp').value.trim();
  const bio = document.getElementById('bioInp').value.trim();
  if(!nick||nick.length<2){document.getElementById('loginErr').textContent='Минимум 2 символа';return;}
  myNick=nick; myBio=bio;
  localStorage.setItem('fitchat_nick',nick);
  localStorage.setItem('fitchat_bio',bio);
  set(ref(db,'users/'+nick),{nick,bio,color:getColor(nick),online:true,lastSeen:Date.now()});
  // Update online status every 30s
  setInterval(()=>set(ref(db,'users/'+nick+'/lastSeen'),Date.now()),30000);
  window.addEventListener('beforeunload',()=>set(ref(db,'users/'+nick+'/online'),false));
  showScreen('chatsScreen');
  loadChats(); loadPosts(); renderProfile();
  updateAILimit();
}

window.logout = function(){
  if(myNick) set(ref(db,'users/'+myNick+'/online'),false);
  myNick=''; localStorage.removeItem('fitchat_nick');
  showScreen('loginScreen');
}

function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}

// TABS
window.showTab = function(tab, el){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  if(tab==='chats') showScreen('chatsScreen');
  else if(tab==='posts') showScreen('postsScreen');
  else if(tab==='profile'){showScreen('profileScreen');renderProfile();}
}

// CHATS
function loadChats(){
  onValue(ref(db,'groups'),snap=>{
    allChats=allChats.filter(c=>c.type!=='group');
    if(snap.val()) Object.entries(snap.val()).forEach(([id,g])=>{
      allChats.push({id,type:'group',name:g.name,lastMsg:g.lastMsg||'',lastTime:g.lastTime||0,color:'#00cc88'});
    });
    renderChats();
  });
  onValue(ref(db,'dms'),snap=>{
    allChats=allChats.filter(c=>c.type!=='dm');
    if(snap.val()) Object.entries(snap.val()).forEach(([id,dm])=>{
      if(id.includes(myNick)){
        const other=id.split('_').find(n=>n!==myNick)||id;
        allChats.push({id,type:'dm',name:other,lastMsg:dm.lastMsg||'',lastTime:dm.lastTime||0,color:getColor(other)});
      }
    });
    renderChats();
  });
}

function renderChats(){
  const q=document.getElementById('searchInp').value.toLowerCase();
  let f=allChats.filter(c=>{
    if(q&&!c.name.toLowerCase().includes(q))return false;
    if(currentTab==='direct'&&c.type!=='dm')return false;
    if(currentTab==='group'&&c.type!=='group')return false;
    return true;
  }).sort((a,b)=>b.lastTime-a.lastTime);
  const el=document.getElementById('chatsList');
  if(!f.length){el.innerHTML='<div class="empty-list"><div>💬</div><br>Нет чатов. Нажми ✏️ чтобы начать!</div>';return;}
  el.innerHTML=f.map(c=>{
    const t=c.lastTime?new Date(c.lastTime).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):'';
    return `<div class="chat-item" onclick="openChat('${c.id}','${c.type}','${c.name}','${c.color}')">
      <div class="chat-avatar ${c.type==='group'?'group':''}" style="background:${c.color}">${c.type==='group'?'👥':c.name[0].toUpperCase()}</div>
      <div class="chat-info"><div class="chat-name">${c.name}</div><div class="chat-last">${c.lastMsg||'Нет сообщений'}</div></div>
      <div class="chat-meta"><div class="chat-time">${t}</div></div>
    </div>`;
  }).join('');
}

window.filterChats=renderChats;
window.switchTab=function(tab,el){currentTab=tab;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');renderChats();}

// OPEN CHAT
window.openChat=function(id,type,name,color){
  currentChat=id; currentChatType=type;
  const av=document.getElementById('chatHeaderAvatar');
  av.textContent=type==='group'?'👥':name[0].toUpperCase();
  av.style.background=color;
  if(type==='group') av.classList.add('group'); else av.classList.remove('group');
  document.getElementById('chatHeaderName').textContent=name;
  document.getElementById('groupSettingsBtn').style.display=type==='group'?'flex':'none';
  document.getElementById('chatMessages').innerHTML='';
  showScreen('chatScreen');
  // Show online status for DM
  if(type==='dm'){
    onValue(ref(db,'users/'+name),snap=>{
      const u=snap.val();
      if(u){
        const isOnline=u.online&&(Date.now()-u.lastSeen<60000);
        const status=isOnline?'<span class="online-dot"></span>В сети':'Был(а) недавно';
        document.getElementById('chatHeaderStatus').innerHTML=status;
      }
    });
  } else {
    document.getElementById('chatHeaderStatus').innerHTML='👥 Группа';
  }
  loadMessages(id,type);
}

window.backToChats=function(){showScreen('chatsScreen');currentChat=null;document.getElementById('aiPanel').classList.remove('open');}

function loadMessages(chatId,type){
  const path=type==='group'?`groups/${chatId}/messages`:`dms/${chatId}/messages`;
  const q2=query(ref(db,path),orderByChild('ts'),limitToLast(50));
  onValue(q2,snap=>{
    const msgs=document.getElementById('chatMessages');
    msgs.innerHTML='';
    if(!snap.val())return;
    const list=Object.values(snap.val()).sort((a,b)=>a.ts-b.ts);
    let lastDate='',lastNick='';
    list.forEach(m=>{
      const d=new Date(m.ts).toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
      if(d!==lastDate){msgs.innerHTML+=`<div class="date-divider">${d}</div>`;lastDate=d;lastNick='';}
      const isMine=m.nick===myNick;
      const t=new Date(m.ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
      const color=getColor(m.nick);
      if(m.nick!==lastNick){if(!isMine)msgs.innerHTML+=`<div class="msg-sender" style="color:${color}">${m.nick}</div>`;lastNick=m.nick;}
      msgs.innerHTML+=`<div class="msg-group ${isMine?'mine':''}"><div class="msg-row">
        ${!isMine?`<div class="msg-avatar-small" style="background:${color}">${m.nick[0].toUpperCase()}</div>`:''}
        <div class="bubble">${m.text.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
        <div class="msg-time-small">${t}</div>
      </div></div>`;
    });
    msgs.scrollTop=msgs.scrollHeight;
  });
}

window.sendMessage=async function(textOverride){
  const inp=document.getElementById('msgInput');
  const text=textOverride||inp.value.trim();
  if(!text||!currentChat)return;
  if(!textOverride){inp.value='';inp.style.height='auto';}
  const path=currentChatType==='group'?`groups/${currentChat}/messages`:`dms/${currentChat}/messages`;
  await push(ref(db,path),{nick:myNick,text,ts:Date.now()});
  const metaPath=currentChatType==='group'?`groups/${currentChat}`:`dms/${currentChat}`;
  set(ref(db,metaPath+'/lastMsg'),text.substring(0,50));
  set(ref(db,metaPath+'/lastTime'),Date.now());
}

window.sendMessageBtn=function(){spawnParticles();playMsgSound();sendMessage();}

// NEW CHAT MODAL
window.openNewChat=function(){
  document.getElementById('modalTitle').textContent='Новый чат';
  document.getElementById('modalBody').innerHTML=`
    <div class="modal-option" onclick="showDMForm()"><div class="modal-option-icon" style="background:linear-gradient(135deg,rgba(155,0,255,0.3),rgba(255,0,85,0.2))">👤</div><div><div style="font-weight:500;font-size:15px;">Личное сообщение</div><div style="font-size:12px;color:rgba(255,255,255,0.4);">Написать напрямую</div></div></div>
    <div class="modal-option" onclick="showGroupForm()"><div class="modal-option-icon" style="background:linear-gradient(135deg,rgba(0,200,100,0.3),rgba(0,136,255,0.2))">👥</div><div><div style="font-weight:500;font-size:15px;">Создать группу</div><div style="font-size:12px;color:rgba(255,255,255,0.4);">Общий чат</div></div></div>`;
  document.getElementById('modalOverlay').classList.add('open');
}

window.showDMForm=function(){
  document.getElementById('modalBody').innerHTML+=`<div style="margin-top:12px;display:flex;flex-direction:column;gap:10px;">
    <input class="inp" id="dmNickInp" placeholder="Никнейм собеседника..." onkeydown="if(event.key==='Enter')startDM()">
    <button class="btn" onclick="startDM()">Начать чат →</button>
    <div class="err" id="dmErr"></div></div>`;
}

window.showGroupForm=function(){
  document.getElementById('modalBody').innerHTML+=`<div style="margin-top:12px;display:flex;flex-direction:column;gap:10px;">
    <input class="inp" id="groupNameInp" placeholder="Название группы..." onkeydown="if(event.key==='Enter')createGroup()">
    <button class="btn" onclick="createGroup()">Создать 👥</button>
    <div class="err" id="groupErr"></div></div>`;
}

window.startDM=async function(){
  const other=document.getElementById('dmNickInp').value.trim();
  if(!other){document.getElementById('dmErr').textContent='Введи никнейм';return;}
  if(other===myNick){document.getElementById('dmErr').textContent='Нельзя писать себе';return;}
  const dmId=[myNick,other].sort().join('_');
  const snap=await get(ref(db,'dms/'+dmId));
  if(!snap.val()) await set(ref(db,'dms/'+dmId),{members:{[myNick]:true,[other]:true},created:Date.now()});
  closeModalNow();
  openChat(dmId,'dm',other,getColor(other));
}

window.createGroup=async function(){
  const name=document.getElementById('groupNameInp').value.trim();
  if(!name){document.getElementById('groupErr').textContent='Введи название';return;}
  const gr=push(ref(db,'groups'));
  await set(gr,{name,creator:myNick,created:Date.now(),members:{[myNick]:true}});
  closeModalNow();
  openChat(gr.key,'group',name,'#00cc88');
}

// GROUP SETTINGS
window.openGroupSettings=async function(){
  const snap=await get(ref(db,'groups/'+currentChat));
  const group=snap.val();
  if(!group)return;
  const members=group.members?Object.keys(group.members):[];
  const isAdmin=group.creator===myNick||myNick===ADMIN_NICK;
  document.getElementById('modalTitle').textContent='⚙️ Настройки группы';
  document.getElementById('modalBody').innerHTML=`
    <div style="font-size:13px;color:rgba(255,255,255,0.4);margin-bottom:8px;">Участники (${members.length}):</div>
    ${members.map(m=>`<div class="member-item">
      <div style="width:32px;height:32px;border-radius:50%;background:${getColor(m)};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:white;">${m[0].toUpperCase()}</div>
      <span style="font-size:14px;">${m}</span>
      ${isAdmin&&m!==myNick?`<button class="remove-btn" onclick="kickMember('${m}')">Выгнать</button>`:''}
    </div>`).join('')}
    ${isAdmin?`<div class="add-wrap"><input class="inp" id="inviteInp" placeholder="Пригласить по никнейму..."><button class="small-btn" onclick="inviteMember()">+ Пригласить</button></div><div class="err" id="inviteErr"></div>`:''}`;
  document.getElementById('modalOverlay').classList.add('open');
}

window.inviteMember=async function(){
  const nick=document.getElementById('inviteInp').value.trim();
  if(!nick){document.getElementById('inviteErr').textContent='Введи никнейм';return;}
  await set(ref(db,`groups/${currentChat}/members/${nick}`),true);
  openGroupSettings();
}

window.kickMember=async function(nick){
  await remove(ref(db,`groups/${currentChat}/members/${nick}`));
  openGroupSettings();
}

window.closeModal=function(e){if(e.target.id==='modalOverlay')closeModalNow();}
function closeModalNow(){document.getElementById('modalOverlay').classList.remove('open');}

// POSTS
function loadPosts(){
  onValue(query(ref(db,'posts'),orderByChild('ts'),limitToLast(30)),snap=>{
    const el=document.getElementById('postsList');
    if(!snap.val()){el.innerHTML='<div class="empty-list"><div>📰</div><br>Нет постов. Будь первым!</div>';return;}
    const list=Object.entries(snap.val()).map(([id,p])=>({id,...p})).sort((a,b)=>b.ts-a.ts);
    el.innerHTML=list.map(p=>renderPost(p)).join('');
  });
}

function renderPost(p){
  const t=new Date(p.ts).toLocaleDateString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  const likes=p.likes?Object.keys(p.likes).length:0;
  const liked=p.likes&&p.likes[myNick];
  const comments=p.comments?Object.values(p.comments):[];
  return `<div class="post-card" id="post-${p.id}">
    <div class="post-header">
      <div class="post-avatar" style="background:${getColor(p.nick)}">${p.nick[0].toUpperCase()}</div>
      <div><div class="post-nick">${p.nick}</div><div class="post-time">${t}</div></div>
    </div>
    <div class="post-text">${p.text.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
    <div class="post-actions">
      <div class="post-action ${liked?'liked':''}" onclick="toggleLike('${p.id}')">❤️ ${likes}</div>
      <div class="post-action" onclick="toggleComments('${p.id}')">💬 ${comments.length}</div>
    </div>
    <div class="post-comments" id="comments-${p.id}" style="display:none;">
      ${comments.map(c=>`<div class="comment"><div class="msg-avatar-small" style="background:${getColor(c.nick)}">${c.nick[0].toUpperCase()}</div><div class="comment-bubble"><div class="comment-nick">${c.nick}</div>${c.text.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div></div>`).join('')}
      <div class="comment-input-wrap"><input class="comment-inp" id="ci-${p.id}" placeholder="Комментарий..." onkeydown="if(event.key==='Enter')addComment('${p.id}')"><button class="small-send" onclick="addComment('${p.id}')">➤</button></div>
    </div>
  </div>`;
}

window.toggleLike=async function(postId){
  const likeRef=ref(db,`posts/${postId}/likes/${myNick}`);
  const snap=await get(likeRef);
  if(snap.val()) await remove(likeRef); else await set(likeRef,true);
}

window.toggleComments=function(postId){
  const el=document.getElementById('comments-'+postId);
  el.style.display=el.style.display==='none'?'block':'none';
}

window.addComment=async function(postId){
  const inp=document.getElementById('ci-'+postId);
  const text=inp.value.trim();
  if(!text)return;
  inp.value='';
  await push(ref(db,`posts/${postId}/comments`),{nick:myNick,text,ts:Date.now()});
}

window.openNewPost=function(){
  document.getElementById('modalTitle').textContent='✏️ Новый пост';
  document.getElementById('modalBody').innerHTML=`
    <textarea class="inp" id="newPostText" placeholder="Что у тебя нового?..." rows="4" style="resize:none;margin-bottom:12px;"></textarea>
    <button class="btn" onclick="publishPost()">Опубликовать 🚀</button>
    <div class="err" id="postErr"></div>`;
  document.getElementById('modalOverlay').classList.add('open');
}

window.publishPost=async function(){
  const text=document.getElementById('newPostText').value.trim();
  if(!text){document.getElementById('postErr').textContent='Напиши что-нибудь';return;}
  await push(ref(db,'posts'),{nick:myNick,text,ts:Date.now()});
  closeModalNow();
}

// PROFILE
function renderProfile(){
  const color=getColor(myNick);
  document.getElementById('profileWrap').innerHTML=`
    <div class="profile-card">
      <div class="profile-big-avatar" style="background:${color}">${myNick?myNick[0].toUpperCase():'?'}</div>
      <div class="profile-name">${myNick}</div>
      <div class="profile-bio">${myBio||'Нет описания'}</div>
    </div>
    <div class="profile-section">
      <div class="profile-section-title">Редактировать</div>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <input class="inp" id="editNickInp" placeholder="Новый никнейм..." value="${myNick}">
        <input class="inp" id="editBioInp" placeholder="О себе..." value="${myBio}">
        <button class="btn" onclick="saveProfile()">Сохранить</button>
      </div>
    </div>
    ${myNick===ADMIN_NICK?`<div class="profile-section" style="border-color:rgba(255,0,85,0.3);">
      <div class="profile-section-title" style="color:#ff6b9d;">👑 Администратор</div>
      <div class="profile-row" onclick="adminPanel()"><div class="profile-row-icon" style="background:rgba(255,0,85,0.15);">⚡</div><div class="profile-row-text">Панель управления<div class="profile-row-sub">Управление пользователями</div></div></div>
    </div>`:''}
    <div class="profile-section">
      <div class="profile-row" onclick="logout()"><div class="profile-row-icon" style="background:rgba(220,50,50,0.15);">🚪</div><div class="profile-row-text" style="color:#f87171;">Выйти из аккаунта</div></div>
    </div>`;
}

window.saveProfile=async function(){
  const newNick=document.getElementById('editNickInp').value.trim();
  const newBio=document.getElementById('editBioInp').value.trim();
  if(!newNick||newNick.length<2)return;
  myNick=newNick; myBio=newBio;
  localStorage.setItem('fitchat_nick',newNick);
  localStorage.setItem('fitchat_bio',newBio);
  await set(ref(db,'users/'+newNick),{nick:newNick,bio:newBio,color:getColor(newNick),online:true,lastSeen:Date.now()});
  renderProfile();
}

window.adminPanel=function(){
  document.getElementById('modalTitle').textContent='👑 Панель администратора';
  // Load all users
  get(ref(db,'users')).then(snap=>{
    const users=snap.val()||{};
    document.getElementById('modalBody').innerHTML=`
      <div style="font-size:13px;color:rgba(255,255,255,0.4);margin-bottom:12px;">Пользователи (${Object.keys(users).length}):</div>
      ${Object.values(users).map(u=>`<div class="member-item">
        <div style="width:32px;height:32px;border-radius:50%;background:${getColor(u.nick)};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:white;">${u.nick[0].toUpperCase()}</div>
        <div><div style="font-size:14px;">${u.nick}</div><div style="font-size:11px;color:rgba(255,255,255,0.3);">${u.bio||''}</div></div>
        ${u.nick!==ADMIN_NICK?`<button class="remove-btn" onclick="banUser('${u.nick}')">Бан</button>`:''}
      </div>`).join('')}`;
  });
  document.getElementById('modalOverlay').classList.add('open');
}

window.banUser=async function(nick){
  await remove(ref(db,'users/'+nick));
  adminPanel();
}

// AI
window.toggleAI=function(){document.getElementById('aiPanel').classList.toggle('open');}
window.aiQuick=function(prefix){document.getElementById('aiInp').value=prefix;document.getElementById('aiInp').focus();}

function updateAILimit(){
  const used=parseInt(localStorage.getItem('ai_requests_'+getTodayKey())||0);
  aiRequests=used;
  document.getElementById('aiLimit').textContent=`Запросов: ${AI_LIMIT-used}/${AI_LIMIT}`;
}

function getTodayKey(){return new Date().toDateString();}

window.sendAI=async function(){
  const inp=document.getElementById('aiInp');
  const text=inp.value.trim();
  if(!text)return;
  const used=parseInt(localStorage.getItem('ai_requests_'+getTodayKey())||0);
  if(used>=AI_LIMIT){addAIMsg('⚠️ Лимит запросов исчерпан на сегодня. Попробуй завтра!','ai');return;}
  inp.value='';
  addAIMsg(text,'user');
  addAIMsg('⏳ Думаю...','ai','thinking');
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:500,
        system:'Ты полезный ассистент в мессенджере FitChat. Отвечай коротко и по делу на русском языке.',
        messages:[{role:'user',content:text}]
      })
    });
    const data=await res.json();
    const reply=data.content?.[0]?.text||'Не удалось получить ответ.';
    document.getElementById('thinking')?.remove();
    lastAIResponse=reply;
    addAIMsg(reply,'ai');
    document.getElementById('aiSendToChat').style.display='block';
    localStorage.setItem('ai_requests_'+getTodayKey(),used+1);
    updateAILimit();
  }catch(e){
    document.getElementById('thinking')?.remove();
    addAIMsg('Ошибка подключения к ИИ. Попробуй позже.','ai');
  }
}

function addAIMsg(text,role,id){
  const el=document.getElementById('aiMessages');
  const div=document.createElement('div');
  div.className=`ai-msg ${role}`;
  if(id) div.id=id;
  div.textContent=text;
  el.appendChild(div);
  el.scrollTop=el.scrollHeight;
}

window.sendAIToChat=function(){
  if(!lastAIResponse||!currentChat)return;
  sendMessage(lastAIResponse);
  document.getElementById('aiPanel').classList.remove('open');
  document.getElementById('aiSendToChat').style.display='none';
}

// SOUNDS
function playMsgSound(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine';o.frequency.setValueAtTime(900,ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(1500,ctx.currentTime+0.08);
    g.gain.setValueAtTime(0.1,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.15);
    o.connect(g);g.connect(ctx.destination);
    o.start();o.stop(ctx.currentTime+0.15);
  }catch(e){}
}

// PARTICLES
function spawnParticles(){
  const btn=document.querySelector('.send-btn');
  if(!btn)return;
  const rect=btn.getBoundingClientRect();
  const x=rect.left+rect.width/2,y=rect.top+rect.height/2;
  const colors=['#d87bff','#ff6b9d','#9b00ff','#ff0055'];
  for(let i=0;i<10;i++){
    const p=document.createElement('div');p.className='particle';
    const angle=(360/10)*i,dist=40+Math.random()*40;
    const rad=angle*Math.PI/180,size=4+Math.random()*5;
    p.style.cssText=`left:${x-size/2}px;top:${y-size/2}px;width:${size}px;height:${size}px;background:${colors[i%4]};--tx:${Math.cos(rad)*dist}px;--ty:${Math.sin(rad)*dist}px;box-shadow:0 0 6px ${colors[i%4]};`;
    document.body.appendChild(p);setTimeout(()=>p.remove(),700);
  }
}

function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,100)+'px';}
window.autoResize=autoResize;

// AUTO LOGIN

const savedBio=localStorage.getItem('fitchat_bio')||'';
if(saved){document.getElementById('nickInp').value=saved;document.getElementById('bioInp').value=savedBio;}
</script>
