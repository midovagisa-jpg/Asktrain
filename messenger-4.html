<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FitChat</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: #0a0a14; font-family: 'Inter', sans-serif; color: #e2e8f0; }
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-thumb { background: rgba(139,92,246,0.3); border-radius: 2px; }

.bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
.orb { position: absolute; border-radius: 50%; pointer-events: none; }
.orb1 { width: 500px; height: 500px; background: radial-gradient(circle,rgba(124,58,237,0.18) 0%,transparent 70%); animation: f1 8s ease-in-out infinite; top:-150px; left:-150px; }
.orb2 { width: 400px; height: 400px; background: radial-gradient(circle,rgba(59,130,246,0.14) 0%,transparent 70%); animation: f2 10s ease-in-out infinite; bottom:-100px; right:-100px; }
@keyframes f1{0%,100%{transform:translate(0,0)}50%{transform:translate(100px,80px)}}
@keyframes f2{0%,100%{transform:translate(0,0)}50%{transform:translate(-80px,-60px)}}
.bg-dots { position: fixed; inset: 0; z-index: 0; background-image: radial-gradient(rgba(139,92,246,0.05) 1px,transparent 1px); background-size: 28px 28px; pointer-events: none; }

/* SCREENS */
.screen { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; }
.screen.active { display: flex; }

/* LOGIN */
#loginScreen { align-items: center; justify-content: center; padding: 24px; background: rgba(10,10,20,0.95); backdrop-filter: blur(20px); }
.login-card { width: 100%; max-width: 340px; background: rgba(255,255,255,0.04); border: 1px solid rgba(139,92,246,0.2); border-radius: 24px; padding: 32px 24px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.app-logo { width: 72px; height: 72px; border-radius: 22px; background: linear-gradient(135deg,#7c3aed,#3b82f6); display: flex; align-items: center; justify-content: center; font-size: 32px; box-shadow: 0 0 30px rgba(124,58,237,0.4); }
.app-name { font-family: 'Space Grotesk',sans-serif; font-size: 28px; font-weight: 700; background: linear-gradient(135deg,#a78bfa,#60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.app-tagline { font-size: 13px; color: rgba(255,255,255,0.4); text-align: center; }
.inp { width: 100%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; color: #e2e8f0; padding: 13px 18px; font-size: 15px; font-family: 'Inter',sans-serif; transition: all 0.2s; }
.inp:focus { outline: none; border-color: rgba(139,92,246,0.5); background: rgba(255,255,255,0.08); }
.inp::placeholder { color: rgba(255,255,255,0.25); }
.btn { width: 100%; background: linear-gradient(135deg,#7c3aed,#3b82f6); border: none; border-radius: 14px; color: white; padding: 14px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: 'Inter',sans-serif; box-shadow: 0 4px 20px rgba(124,58,237,0.4); transition: all 0.2s; }
.btn:hover { transform: translateY(-1px); }
.err { font-size: 12px; color: #f87171; min-height: 16px; }

/* CHATS LIST */
#chatsScreen { background: #0a0a14; }
.top-bar { padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; background: rgba(10,10,20,0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(139,92,246,0.15); flex-shrink: 0; z-index: 1; }
.top-bar-title { font-family: 'Space Grotesk',sans-serif; font-size: 20px; font-weight: 700; background: linear-gradient(135deg,#a78bfa,#60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.shimmer-line { height: 2px; background: linear-gradient(90deg,transparent,#7c3aed,#3b82f6,#a78bfa,transparent); background-size: 200% 100%; animation: shimmer 3s linear infinite; flex-shrink: 0; }
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.icon-btn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid rgba(139,92,246,0.25); background: rgba(139,92,246,0.1); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; transition: all 0.2s; }
.icon-btn:hover { background: rgba(139,92,246,0.2); }

.search-bar { padding: 10px 14px; background: rgba(10,10,20,0.6); flex-shrink: 0; }
.search-inp { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; color: #e2e8f0; padding: 9px 14px; font-size: 14px; font-family: 'Inter',sans-serif; }
.search-inp:focus { outline: none; border-color: rgba(139,92,246,0.4); }
.search-inp::placeholder { color: rgba(255,255,255,0.2); }

.tabs { display: flex; padding: 0 14px; gap: 4px; background: rgba(10,10,20,0.6); flex-shrink: 0; }
.tab { padding: 10px 16px; font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.4); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; }
.tab.active { color: #a78bfa; border-bottom-color: #a78bfa; }

.list { flex: 1; overflow-y: auto; }
.chat-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.04); cursor: pointer; transition: background 0.15s; }
.chat-item:hover { background: rgba(255,255,255,0.03); }
.chat-avatar { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; color: white; flex-shrink: 0; }
.chat-avatar.group { border-radius: 14px; }
.chat-info { flex: 1; min-width: 0; }
.chat-name { font-weight: 600; font-size: 15px; color: #e2e8f0; }
.chat-last { font-size: 13px; color: rgba(255,255,255,0.4); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.chat-time { font-size: 11px; color: rgba(255,255,255,0.3); }
.unread { background: linear-gradient(135deg,#7c3aed,#3b82f6); color: white; font-size: 11px; font-weight: 700; border-radius: 10px; padding: 2px 7px; min-width: 20px; text-align: center; }

.fab { position: fixed; bottom: 24px; right: 20px; width: 54px; height: 54px; border-radius: 16px; background: linear-gradient(135deg,#7c3aed,#3b82f6); border: none; color: white; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(124,58,237,0.5); transition: all 0.2s; z-index: 5; }
.fab:hover { transform: scale(1.08); }

.empty-list { text-align: center; padding: 60px 24px; color: rgba(255,255,255,0.25); font-size: 14px; }
.empty-list div:first-child { font-size: 44px; margin-bottom: 12px; }

/* CHAT SCREEN */
#chatScreen { background: #0a0a14; }
.chat-header { padding: 12px 16px; display: flex; align-items: center; gap: 12px; background: rgba(10,10,20,0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(139,92,246,0.15); flex-shrink: 0; }
.back-btn { width: 34px; height: 34px; border-radius: 10px; border: none; background: rgba(255,255,255,0.06); color: #a78bfa; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.chat-header-avatar { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: white; flex-shrink: 0; }
.chat-header-avatar.group { border-radius: 12px; }
.chat-header-info { flex: 1; }
.chat-header-name { font-weight: 600; font-size: 15px; }
.chat-header-status { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 1px; }

.messages { flex: 1; overflow-y: auto; padding: 14px 14px 8px; display: flex; flex-direction: column; gap: 4px; }
.msg-group { display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px; }
.msg-group.mine { align-items: flex-end; }
.msg-sender { font-size: 11px; font-weight: 600; margin-bottom: 2px; padding: 0 4px; }
.msg-row { display: flex; align-items: flex-end; gap: 6px; animation: msgIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both; }
.msg-group.mine .msg-row { flex-direction: row-reverse; }
@keyframes msgIn{from{opacity:0;transform:translateY(10px) scale(0.92)}to{opacity:1;transform:translateY(0) scale(1)}}
.msg-avatar-small { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: white; flex-shrink: 0; }
.bubble { max-width: 75%; padding: 9px 13px; font-size: 14px; line-height: 1.55; word-break: break-word; position: relative; }
.msg-group:not(.mine) .bubble { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 4px 14px 14px 14px; color: #e2e8f0; }
.msg-group.mine .bubble { background: linear-gradient(135deg,rgba(124,58,237,0.45),rgba(59,130,246,0.35)); border: 1px solid rgba(139,92,246,0.35); border-radius: 14px 4px 14px 14px; color: #e2e8f0; }
.msg-time-small { font-size: 10px; color: rgba(255,255,255,0.25); padding: 0 4px; align-self: flex-end; white-space: nowrap; }
.date-divider { text-align: center; font-size: 11px; color: rgba(255,255,255,0.25); padding: 8px 0; }

.input-wrap { padding: 10px 12px; background: rgba(10,10,20,0.9); backdrop-filter: blur(20px); border-top: 1px solid rgba(139,92,246,0.12); display: flex; gap: 8px; align-items: flex-end; flex-shrink: 0; }
.msg-input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; color: #e2e8f0; padding: 10px 14px; font-size: 14px; font-family: 'Inter',sans-serif; resize: none; max-height: 100px; line-height: 1.5; transition: all 0.2s; }
.msg-input:focus { outline: none; border-color: rgba(139,92,246,0.5); }
.msg-input::placeholder { color: rgba(255,255,255,0.25); }
.send-btn { width: 40px; height: 40px; border-radius: 12px; border: none; color: white; font-size: 16px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg,#7c3aed,#3b82f6,#a78bfa,#3b82f6,#7c3aed); background-size: 300% 300%; animation: gradMove 4s ease infinite; box-shadow: 0 4px 15px rgba(124,58,237,0.4); transition: transform 0.2s; }
.send-btn:hover { transform: scale(1.08); }
@keyframes gradMove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

/* NEW CHAT MODAL */
.modal-overlay { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); display: none; align-items: flex-end; }
.modal-overlay.open { display: flex; }
.modal { width: 100%; background: #12121e; border-radius: 24px 24px 0 0; border-top: 1px solid rgba(139,92,246,0.2); padding: 20px; max-height: 80vh; overflow-y: auto; animation: slideUp 0.3s cubic-bezier(0.34,1.56,0.64,1); }
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-title { font-family: 'Space Grotesk',sans-serif; font-size: 18px; font-weight: 600; color: #a78bfa; margin-bottom: 16px; }
.modal-option { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; cursor: pointer; transition: background 0.15s; margin-bottom: 8px; }
.modal-option:hover { background: rgba(255,255,255,0.05); }
.modal-option-icon { width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.modal-option-text { font-weight: 500; font-size: 15px; }
.modal-option-sub { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 1px; }
.modal-input-group { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }

.particle { position: fixed; border-radius: 50%; pointer-events: none; z-index: 999; animation: pFly 0.7s ease-out forwards; }
@keyframes pFly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0)}}

/* Message animations */
@keyframes msgInLeft{from{opacity:0;transform:translateX(-20px) scale(0.88);}to{opacity:1;transform:translateX(0) scale(1);}}
@keyframes msgInRight{from{opacity:0;transform:translateX(20px) scale(0.88);}to{opacity:1;transform:translateX(0) scale(1);}}
.msg-group:not(.mine) .bubble { animation: msgInLeft 0.45s cubic-bezier(0.34,1.56,0.64,1) both; }
.msg-group.mine .bubble { animation: msgInRight 0.45s cubic-bezier(0.34,1.56,0.64,1) both; }

/* Group management modal */
.member-item { display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;transition:background 0.15s; }
.member-item:hover { background:rgba(255,255,255,0.05); }
.remove-btn { margin-left:auto;background:rgba(220,50,50,0.15);border:1px solid rgba(220,50,50,0.25);color:#f87171;border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer; }
.add-member-wrap { display:flex;gap:8px;margin-top:10px; }
.add-member-inp { flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:10px;color:#e2e8f0;padding:8px 12px;font-size:13px;font-family:Inter,sans-serif; }
.add-member-inp:focus { outline:none;border-color:rgba(139,92,246,0.5); }
.small-btn { background:linear-gradient(135deg,#7c3aed,#3b82f6);border:none;border-radius:10px;color:white;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer; }

.online-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; display: inline-block; margin-right: 4px; animation: blink 2s infinite; }
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.4}}
</style>
</head>
<body>
<div class="bg"><div class="orb orb1"></div><div class="orb orb2"></div></div>
<div class="bg-dots"></div>

<!-- LOGIN -->
<div id="loginScreen" class="screen active">
  <div class="login-card">
    <div class="app-logo">💬</div>
    <div class="app-name">FitChat</div>
    <div class="app-tagline">Мессенджер для общения. Войди по никнейму.</div>
    <input class="inp" id="nickInp" type="text" placeholder="Твой никнейм..." maxlength="20" onkeydown="if(event.key==='Enter')login()">
    <button class="btn" onclick="login()">Войти ⚡</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- CHATS -->
<div id="chatsScreen" class="screen">
  <div class="top-bar">
    <div class="top-bar-title">💬 FitChat</div>
    <div style="display:flex;gap:8px;align-items:center;">
      <div style="display:flex;align-items:center;gap:5px;font-size:12px;color:rgba(255,255,255,0.4);">
        <span class="online-dot"></span><span id="myNickLabel"></span>
      </div>
      <div class="icon-btn" onclick="logout()" title="Выйти">🚪</div>
    </div>
  </div>
  <div class="shimmer-line"></div>
  <div class="search-bar"><input class="search-inp" id="searchInp" placeholder="🔍 Поиск..." oninput="filterChats()"></div>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('all',this)">Все</div>
    <div class="tab" onclick="switchTab('direct',this)">Личные</div>
    <div class="tab" onclick="switchTab('group',this)">Группы</div>
  </div>
  <div class="list" id="chatsList"></div>
  <button class="fab" onclick="openNewChat()">✏️</button>
</div>

<!-- CHAT -->
<div id="chatScreen" class="screen">
  <div class="chat-header">
    <button class="back-btn" onclick="backToChats()">‹</button>
    <div class="chat-header-avatar" id="chatHeaderAvatar"></div>
    <div class="chat-header-info">
      <div class="chat-header-name" id="chatHeaderName"></div>
      <div class="chat-header-status" id="chatHeaderStatus"></div>
    </div>
    <div class="icon-btn" id="groupSettingsBtn" style="display:none;" onclick="openGroupSettings()">⚙️</div>
  </div>
  <div class="shimmer-line"></div>
  <div class="messages" id="chatMessages"></div>
  <div class="input-wrap">
    <textarea class="msg-input" id="msgInput" placeholder="Сообщение..." rows="1" oninput="autoResize(this)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
    <button class="send-btn" onclick="sendMessageBtn()">➤</button>
  </div>
</div>

<!-- NEW CHAT MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-title">Новый чат</div>
    <div class="modal-option" onclick="showDirectChat()">
      <div class="modal-option-icon" style="background:linear-gradient(135deg,rgba(124,58,237,0.3),rgba(59,130,246,0.2))">👤</div>
      <div><div class="modal-option-text">Личное сообщение</div><div class="modal-option-sub">Напиши кому-нибудь напрямую</div></div>
    </div>
    <div class="modal-option" onclick="showCreateGroup()">
      <div class="modal-option-icon" style="background:linear-gradient(135deg,rgba(16,185,129,0.3),rgba(59,130,246,0.2))">👥</div>
      <div><div class="modal-option-text">Создать группу</div><div class="modal-option-sub">Общий чат для нескольких людей</div></div>
    </div>
    <div id="modalForm"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onValue, set, get, serverTimestamp, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyADCa1uZpA-rhtmnNcf96UaBxqcY7lDL3M",
  authDomain: "fitchat-6d903.firebaseapp.com",
  databaseURL: "https://fitchat-6d903-default-rtdb.firebaseio.com",
  projectId: "fitchat-6d903",
  storageBucket: "fitchat-6d903.firebasestorage.app",
  messagingSenderId: "1060135785203",
  appId: "1:1060135785203:web:ca4123d7d551ee22889d86",
  measurementId: "G-1FRDWP8CMM"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const COLORS = ['#7c3aed','#3b82f6','#059669','#d97706','#dc2626','#db2777','#0891b2'];
function getColor(s){ let h=0; for(let c of s) h=Math.imul(31,h)+c.charCodeAt(0)|0; return COLORS[Math.abs(h)%COLORS.length]; }
function hashCode(s){ let h=0; for(let c of s) h=Math.imul(31,h)+c.charCodeAt(0)|0; return Math.abs(h); }

let myNick = '', currentChat = null, currentChatType = '', chatsUnsubscribe = {}, currentTab = 'all';
let allChats = [];

// LOGIN
window.login = function() {
  const nick = document.getElementById('nickInp').value.trim();
  if(!nick || nick.length<2){ document.getElementById('loginErr').textContent='Минимум 2 символа'; return; }
  myNick = nick;
  localStorage.setItem('fitchat_nick', nick);
  document.getElementById('myNickLabel').textContent = nick;
  // Register user
  set(ref(db, 'users/'+nick), { nick, color: getColor(nick), lastSeen: serverTimestamp() });
  showScreen('chatsScreen');
  loadChats();
}

// LOGOUT
window.logout = function() {
  myNick = '';
  localStorage.removeItem('fitchat_nick');
  showScreen('loginScreen');
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// CHATS LIST
function loadChats() {
  // Listen to public groups
  onValue(ref(db,'groups'), snap=>{
    allChats = allChats.filter(c=>c.type!=='group');
    if(snap.val()){
      Object.entries(snap.val()).forEach(([id,g])=>{
        allChats.push({id, type:'group', name:g.name, icon:'👥', lastMsg:g.lastMsg||'', lastTime:g.lastTime||0, color:'#059669'});
      });
    }
    renderChats();
  });
  // Listen to DMs involving me
  onValue(ref(db,'dms'), snap=>{
    allChats = allChats.filter(c=>c.type!=='dm');
    if(snap.val()){
      Object.entries(snap.val()).forEach(([id,dm])=>{
        if(id.includes(myNick)){
          const other = id.replace(myNick,'').replace('_','').replace('_','') || id.split('_').find(n=>n!==myNick);
          const otherNick = id.split('_').find(n=>n!==myNick) || other;
          allChats.push({id, type:'dm', name:otherNick, icon:'👤', lastMsg:dm.lastMsg||'', lastTime:dm.lastTime||0, color:getColor(otherNick)});
        }
      });
    }
    renderChats();
  });
}

function renderChats() {
  const q = document.getElementById('searchInp').value.toLowerCase();
  let filtered = allChats.filter(c=>{
    if(q && !c.name.toLowerCase().includes(q)) return false;
    if(currentTab==='direct' && c.type!=='dm') return false;
    if(currentTab==='group' && c.type!=='group') return false;
    return true;
  });
  filtered.sort((a,b)=>b.lastTime-a.lastTime);
  const el = document.getElementById('chatsList');
  if(!filtered.length){
    el.innerHTML='<div class="empty-list"><div>💬</div>Нет чатов. Нажми ✏️ чтобы начать!</div>';
    return;
  }
  el.innerHTML = filtered.map(c=>{
    const time = c.lastTime ? new Date(c.lastTime).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}) : '';
    const avatarStyle = c.type==='group' ? 'group' : '';
    return `<div class="chat-item" onclick="openChat('${c.id}','${c.type}','${c.name}','${c.color}')">
      <div class="chat-avatar ${avatarStyle}" style="background:${c.color}">${c.type==='group'?'👥':c.name[0].toUpperCase()}</div>
      <div class="chat-info">
        <div class="chat-name">${c.name}</div>
        <div class="chat-last">${c.lastMsg||'Нет сообщений'}</div>
      </div>
      <div class="chat-meta"><div class="chat-time">${time}</div></div>
    </div>`;
  }).join('');
}

window.filterChats = renderChats;
window.switchTab = function(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderChats();
}

// OPEN CHAT
window.openChat = function(id, type, name, color) {
  currentChat = id;
  currentChatType = type;
  const avatarEl = document.getElementById('chatHeaderAvatar');
  avatarEl.textContent = type==='group' ? '👥' : name[0].toUpperCase();
  avatarEl.style.background = color;
  if(type==='group') avatarEl.classList.add('group'); else avatarEl.classList.remove('group');
  document.getElementById('chatHeaderName').textContent = name;
  document.getElementById('chatHeaderStatus').innerHTML = type==='group' ? '👥 Группа' : `<span class="online-dot"></span>${name}`;
  document.getElementById('groupSettingsBtn').style.display = type==='group' ? 'flex' : 'none';
  document.getElementById('chatMessages').innerHTML = '';
  showScreen('chatScreen');
  loadMessages(id, type);
}

window.backToChats = function() {
  showScreen('chatsScreen');
  currentChat = null;
}

function loadMessages(chatId, type) {
  const path = type==='group' ? `groups/${chatId}/messages` : `dms/${chatId}/messages`;
  const q2 = query(ref(db,path), orderByChild('ts'), limitToLast(50));
  onValue(q2, snap=>{
    const msgs = document.getElementById('chatMessages');
    msgs.innerHTML = '';
    if(!snap.val()) return;
    const list = Object.values(snap.val()).sort((a,b)=>a.ts-b.ts);
    let lastDate = '', lastNick = '', lastMine = null;
    list.forEach(m=>{
      const d = new Date(m.ts).toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
      if(d!==lastDate){ msgs.innerHTML+=`<div class="date-divider">${d}</div>`; lastDate=d; lastNick=''; }
      const isMine = m.nick===myNick;
      const t = new Date(m.ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
      const color = getColor(m.nick);
      if(m.nick!==lastNick || isMine!==lastMine){
        if(!isMine) msgs.innerHTML+=`<div class="msg-sender" style="color:${color}">${m.nick}</div>`;
        lastNick=m.nick; lastMine=isMine;
      }
      msgs.innerHTML+=`<div class="msg-group ${isMine?'mine':''}">
        <div class="msg-row">
          ${!isMine?`<div class="msg-avatar-small" style="background:${color}">${m.nick[0].toUpperCase()}</div>`:''}
          <div class="bubble">${m.text.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
          <div class="msg-time-small">${t}</div>
        </div>
      </div>`;
    });
    msgs.scrollTop = msgs.scrollHeight;
  });
}

// SEND MESSAGE
window.sendMessage = async function() {
  const inp = document.getElementById('msgInput');
  const text = inp.value.trim();
  if(!text||!currentChat) return;
  inp.value=''; inp.style.height='auto';
  const path = currentChatType==='group' ? `groups/${currentChat}/messages` : `dms/${currentChat}/messages`;
  const msg = { nick:myNick, text, ts: Date.now() };
  await push(ref(db,path), msg);
  // Update last message
  const metaPath = currentChatType==='group' ? `groups/${currentChat}` : `dms/${currentChat}`;
  set(ref(db,metaPath+'/lastMsg'), text.substring(0,50));
  set(ref(db,metaPath+'/lastTime'), Date.now());
}

window.sendMessageBtn = function() {
  spawnParticles();
  playMsgSound();
  sendMessage();
}

// MODALS
window.openNewChat = function() { document.getElementById('modalOverlay').classList.add('open'); document.getElementById('modalForm').innerHTML=''; }
window.closeModal = function(e) { if(e.target.id==='modalOverlay') document.getElementById('modalOverlay').classList.remove('open'); }

window.showDirectChat = function() {
  document.getElementById('modalForm').innerHTML=`
    <div class="modal-input-group">
      <div style="font-size:13px;color:rgba(255,255,255,0.4);">Введи никнейм собеседника:</div>
      <input class="inp" id="dmNickInp" placeholder="Никнейм..." onkeydown="if(event.key==='Enter')startDM()">
      <button class="btn" onclick="startDM()">Начать чат →</button>
      <div class="err" id="dmErr"></div>
    </div>`;
}

window.startDM = async function() {
  const other = document.getElementById('dmNickInp').value.trim();
  if(!other){ document.getElementById('dmErr').textContent='Введи никнейм'; return; }
  if(other===myNick){ document.getElementById('dmErr').textContent='Нельзя писать себе'; return; }
  const dmId = [myNick,other].sort().join('_');
  // Create DM entry
  const dmRef = ref(db,'dms/'+dmId);
  const snap = await get(dmRef);
  if(!snap.val()) await set(dmRef, {members:{[myNick]:true,[other]:true}, created:Date.now()});
  document.getElementById('modalOverlay').classList.remove('open');
  openChat(dmId,'dm',other,getColor(other));
}

window.showCreateGroup = function() {
  document.getElementById('modalForm').innerHTML=`
    <div class="modal-input-group">
      <div style="font-size:13px;color:rgba(255,255,255,0.4);">Название группы:</div>
      <input class="inp" id="groupNameInp" placeholder="Название..." onkeydown="if(event.key==='Enter')createGroup()">
      <button class="btn" onclick="createGroup()">Создать группу 👥</button>
      <div class="err" id="groupErr"></div>
    </div>`;
}

window.createGroup = async function() {
  const name = document.getElementById('groupNameInp').value.trim();
  if(!name){ document.getElementById('groupErr').textContent='Введи название'; return; }
  const groupRef = push(ref(db,'groups'));
  await set(groupRef, { name, creator:myNick, created:Date.now(), members:{[myNick]:true} });
  document.getElementById('modalOverlay').classList.remove('open');
  openChat(groupRef.key,'group',name,'#059669');
}

function autoResize(el){ el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,100)+'px'; }
window.autoResize = autoResize;

function spawnParticles() {
  const btn = document.querySelector('.send-btn');
  if(!btn) return;
  const rect = btn.getBoundingClientRect();
  const x=rect.left+rect.width/2, y=rect.top+rect.height/2;
  const colors=['#a78bfa','#60a5fa','#c4b5fd','#93c5fd'];
  for(let i=0;i<8;i++){
    const p=document.createElement('div'); p.className='particle';
    const angle=(360/8)*i; const dist=35+Math.random()*30;
    const rad=angle*Math.PI/180; const size=4+Math.random()*5;
    p.style.cssText=`left:${x-size/2}px;top:${y-size/2}px;width:${size}px;height:${size}px;background:${colors[i%4]};--tx:${Math.cos(rad)*dist}px;--ty:${Math.sin(rad)*dist}px;`;
    document.body.appendChild(p); setTimeout(()=>p.remove(),700);
  }
}

// Auto login
const saved = localStorage.getItem('fitchat_nick');
if(saved){ document.getElementById('nickInp').value=saved; }

// SOUNDS
function playMsgSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o1 = ctx.createOscillator(), g1 = ctx.createGain();
    o1.type = 'sine'; o1.frequency.setValueAtTime(800, ctx.currentTime);
    o1.frequency.exponentialRampToValueAtTime(1400, ctx.currentTime + 0.08);
    g1.gain.setValueAtTime(0.12, ctx.currentTime);
    g1.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
    o1.connect(g1); g1.connect(ctx.destination);
    o1.start(); o1.stop(ctx.currentTime + 0.15);
    const o2 = ctx.createOscillator(), g2 = ctx.createGain();
    o2.type = 'sine'; o2.frequency.setValueAtTime(1200, ctx.currentTime + 0.05);
    o2.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.18);
    g2.gain.setValueAtTime(0.07, ctx.currentTime + 0.05);
    g2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
    o2.connect(g2); g2.connect(ctx.destination);
    o2.start(ctx.currentTime + 0.05); o2.stop(ctx.currentTime + 0.2);
  } catch(e) {}
}

// GROUP SETTINGS
window.openGroupSettings = async function() {
  if(currentChatType !== 'group') return;
  const snap = await get(ref(db, 'groups/'+currentChat));
  const group = snap.val();
  if(!group) return;
  const members = group.members || {};
  const memberList = Object.keys(members);
  const isCreator = group.creator === myNick;

  document.getElementById('modalForm').innerHTML = `
    <div style="margin-top:12px;">
      <div style="font-size:13px;color:rgba(255,255,255,0.4);margin-bottom:8px;">Участники (${memberList.length}):</div>
      ${memberList.map(m => `
        <div class="member-item">
          <div style="width:32px;height:32px;border-radius:50%;background:${getColor(m)};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:white;">${m[0].toUpperCase()}</div>
          <span style="font-size:14px;">${m}</span>
          ${isCreator && m !== myNick ? `<button class="remove-btn" onclick="removeMember('${m}')">Удалить</button>` : ''}
        </div>`).join('')}
      ${isCreator ? `
        <div class="add-member-wrap">
          <input class="add-member-inp" id="addMemberInp" placeholder="Никнейм для добавления...">
          <button class="small-btn" onclick="addMember()">+ Добавить</button>
        </div>
        <div class="err" id="memberErr" style="margin-top:6px;"></div>` : ''}
    </div>`;
  document.getElementById('modalOverlay').classList.add('open');
}

window.addMember = async function() {
  const nick = document.getElementById('addMemberInp').value.trim();
  if(!nick){ document.getElementById('memberErr').textContent='Введи никнейм'; return; }
  await set(ref(db, `groups/${currentChat}/members/${nick}`), true);
  document.getElementById('memberErr').textContent = '';
  openGroupSettings();
}

window.removeMember = async function(nick) {
  const { remove } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js");
  await remove(ref(db, `groups/${currentChat}/members/${nick}`));
  openGroupSettings();
}
</script>
