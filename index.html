<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Asktrain</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { background: #0a0a14; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; height: 100dvh; }
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-thumb { background: rgba(139,92,246,0.3); border-radius: 2px; }

.bg { position: fixed; inset: 0; z-index: 0; background: #0a0a14; overflow: hidden; }
.orb { position: absolute; border-radius: 50%; pointer-events: none; }
.orb1 { width: 600px; height: 600px; background: radial-gradient(circle, rgba(124,58,237,0.25) 0%, transparent 70%); animation: float1 8s ease-in-out infinite; top: -200px; left: -200px; }
.orb2 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(59,130,246,0.2) 0%, transparent 70%); animation: float2 10s ease-in-out infinite; bottom: -150px; right: -150px; }
.orb3 { width: 400px; height: 400px; background: radial-gradient(circle, rgba(139,92,246,0.15) 0%, transparent 70%); animation: float3 12s ease-in-out infinite; top: 50%; left: 50%; transform: translate(-50%,-50%); }
@keyframes float1 { 0%,100%{transform:translate(0,0);} 33%{transform:translate(150px,100px);} 66%{transform:translate(50px,200px);} }
@keyframes float2 { 0%,100%{transform:translate(0,0);} 33%{transform:translate(-120px,-80px);} 66%{transform:translate(-60px,-180px);} }
@keyframes float3 { 0%,100%{transform:translate(-50%,-50%) scale(1);} 50%{transform:translate(-40%,-60%) scale(1.2);} }

.bg-dots { position: fixed; inset: 0; z-index: 0; background-image: radial-gradient(rgba(139,92,246,0.06) 1px, transparent 1px); background-size: 28px 28px; pointer-events: none; }

.header { padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; background: rgba(10,10,20,0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(139,92,246,0.15); flex-shrink: 0; z-index: 1; position: relative; }
.header-left { display: flex; align-items: center; gap: 12px; }
.logo-icon { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg,#7c3aed,#3b82f6); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; box-shadow: 0 0 20px rgba(124,58,237,0.4); cursor: pointer; }
.logo-title { font-family: 'Space Grotesk',sans-serif; font-size: 20px; font-weight: 700; background: linear-gradient(135deg,#a78bfa,#60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.logo-sub { font-size: 10px; color: rgba(255,255,255,0.3); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 1px; }
.status-badge { display: flex; align-items: center; gap: 6px; background: rgba(139,92,246,0.1); border: 1px solid rgba(139,92,246,0.2); border-radius: 20px; padding: 4px 10px; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: #4ade80; animation: blink 2s infinite; }
@keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
.status-text { font-size: 11px; color: rgba(255,255,255,0.5); font-weight: 500; }

.progress-wrap { height: 2px; background: rgba(255,255,255,0.05); flex-shrink: 0; z-index: 1; position: relative; }
.progress-fill { height: 100%; background: linear-gradient(90deg,#7c3aed,#3b82f6); width: 0%; transition: width 0.5s ease; }

.messages { flex: 1; overflow-y: auto; padding: 18px 14px; display: flex; flex-direction: column; gap: 12px; z-index: 1; position: relative; }

.msg { display: flex; align-items: flex-end; gap: 8px; }
.msg.user { justify-content: flex-end; }

.msg-avatar { width: 28px; height: 28px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; }
.msg-avatar.bot { background: linear-gradient(135deg,#7c3aed,#3b82f6,#a78bfa,#3b82f6,#7c3aed); background-size: 300% 300%; animation: gradMove 4s ease infinite; box-shadow: 0 0 12px rgba(124,58,237,0.3); }
.msg-avatar.user { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); border-radius: 50%; color: rgba(255,255,255,0.5); }
@keyframes gradMove { 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }

.msg-bubble { max-width: 78%; padding: 11px 15px; font-size: 14px; line-height: 1.65; font-weight: 400; white-space: pre-wrap; word-break: break-word; }
.msg.bot .msg-bubble { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 4px 16px 16px 16px; color: #e2e8f0; animation: fromLeft 0.5s cubic-bezier(0.34,1.56,0.64,1) both; }
.msg.user .msg-bubble { background: linear-gradient(135deg,rgba(124,58,237,0.35),rgba(59,130,246,0.25)); border: 1px solid rgba(139,92,246,0.3); border-radius: 16px 4px 16px 16px; color: #e2e8f0; animation: fromRight 0.5s cubic-bezier(0.34,1.56,0.64,1) both; }
.msg.card .msg-bubble { background: linear-gradient(135deg,rgba(16,185,129,0.1),rgba(59,130,246,0.08)); border: 1px solid rgba(16,185,129,0.25); border-radius: 16px; color: #6ee7b7; font-size: 13px; line-height: 1.8; max-width: 95%; animation: fromBottom 0.6s cubic-bezier(0.34,1.56,0.64,1) both; }

@keyframes fromLeft { from{opacity:0;transform:translateX(-18px) scale(0.88);} to{opacity:1;transform:translateX(0) scale(1);} }
@keyframes fromRight { from{opacity:0;transform:translateX(18px) scale(0.88);} to{opacity:1;transform:translateX(0) scale(1);} }
@keyframes fromBottom { from{opacity:0;transform:translateY(18px) scale(0.9);} to{opacity:1;transform:translateY(0) scale(1);} }

.input-area { padding: 12px 14px; background: rgba(10,10,20,0.9); backdrop-filter: blur(20px); border-top: 1px solid rgba(139,92,246,0.12); display: flex; gap: 8px; align-items: flex-end; flex-shrink: 0; z-index: 1; position: relative; }
textarea { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; color: #e2e8f0; padding: 10px 16px; font-size: 14px; font-family: 'Inter',sans-serif; resize: none; max-height: 100px; overflow-y: auto; line-height: 1.5; transition: all 0.2s; }
textarea:focus { outline: none; border-color: rgba(139,92,246,0.5); background: rgba(255,255,255,0.07); }
textarea::placeholder { color: rgba(255,255,255,0.25); }
textarea:disabled { opacity: 0.3; }
.send-btn { width: 42px; height: 42px; border-radius: 14px; border: none; font-size: 16px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.2s; color: white; }
.send-btn:not(:disabled) { background: linear-gradient(135deg,#7c3aed,#3b82f6,#a78bfa,#3b82f6,#7c3aed); background-size: 300% 300%; animation: gradMove 4s ease infinite; box-shadow: 0 4px 15px rgba(124,58,237,0.4); }
.send-btn:not(:disabled):hover { transform: scale(1.08); box-shadow: 0 6px 20px rgba(124,58,237,0.5); }
.send-btn:disabled { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.2); cursor: not-allowed; }

.bottom-line { height: 2px; flex-shrink: 0; z-index: 1; background: linear-gradient(90deg,transparent,#7c3aed,#3b82f6,#a78bfa,transparent); background-size: 200% 100%; animation: shimmer 3s linear infinite; }
@keyframes shimmer { 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }

.particle { position: fixed; border-radius: 50%; pointer-events: none; z-index: 999; animation: pFly 0.8s ease-out forwards; }
@keyframes pFly { 0%{opacity:1;transform:translate(0,0) scale(1);} 100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0);} }

/* Admin */
.admin-panel { position: fixed; inset: 0; background: #0a0a14; z-index: 100; display: none; flex-direction: column; }
.admin-panel.open { display: flex; }
.admin-header { padding: 14px 18px; border-bottom: 1px solid rgba(139,92,246,0.15); display: flex; align-items: center; justify-content: space-between; background: rgba(10,10,20,0.9); flex-shrink: 0; }
.admin-title { font-family: 'Space Grotesk',sans-serif; font-size: 20px; font-weight: 700; background: linear-gradient(135deg,#a78bfa,#60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.close-btn { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #aaa; width: 36px; height: 36px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
.admin-body { flex: 1; overflow-y: auto; padding: 14px; }
.order-card { padding: 14px 16px; margin-bottom: 10px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; cursor: pointer; transition: all 0.2s; }
.order-card:hover { border-color: rgba(139,92,246,0.3); }
.order-name { color: #a78bfa; font-weight: 600; font-size: 15px; }
.order-meta { color: rgba(255,255,255,0.3); font-size: 12px; margin-top: 3px; }
.order-goal { color: rgba(255,255,255,0.4); font-size: 12px; margin-top: 3px; }
.order-detail { background: rgba(16,185,129,0.06); border: 1px solid rgba(16,185,129,0.2); border-radius: 14px; padding: 16px; white-space: pre-wrap; font-size: 13px; color: #6ee7b7; line-height: 1.8; }
.back-btn { background: none; border: none; color: #a78bfa; cursor: pointer; font-size: 14px; margin-bottom: 14px; padding: 0; }
.empty-state { text-align: center; margin-top: 60px; color: rgba(255,255,255,0.2); font-size: 14px; }
.pass-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; gap: 16px; padding: 24px; }
.pass-input { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; color: #e2e8f0; padding: 12px 20px; font-size: 16px; width: 100%; max-width: 300px; text-align: center; letter-spacing: 0.2em; }
.pass-input:focus { outline: none; border-color: rgba(139,92,246,0.5); }
.pass-btn { background: linear-gradient(135deg,#7c3aed,#3b82f6); border: none; border-radius: 14px; color: white; padding: 12px 32px; font-size: 15px; font-weight: 600; cursor: pointer; }
.pass-hint { color: rgba(255,100,100,0.7); font-size: 12px; }
</style>
</head>
<body>
<div class="bg">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
</div>
<div class="bg-dots"></div>

<div class="header">
  <div class="header-left">
    <div class="logo-icon" id="logoIcon">⚡</div>
    <div>
      <div class="logo-title">ASKTRAIN</div>
      <div class="logo-sub">Персональные тренировки</div>
    </div>
  </div>
  <div class="status-badge">
    <div class="status-dot" id="statusDot"></div>
    <span class="status-text" id="statusText">0/10</span>
  </div>
</div>
<div class="progress-wrap"><div class="progress-fill" id="progress"></div></div>
<div class="messages" id="messages"></div>
<div class="input-area">
  <textarea id="input" placeholder="Напишите ответ…" rows="1" oninput="autoResize(this)"></textarea>
  <button class="send-btn" id="sendBtn" onclick="sendWithParticles(event)">➤</button>
</div>
<div class="bottom-line"></div>

<div class="admin-panel" id="adminPanel">
  <div class="admin-header">
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="logo-icon" style="width:32px;height:32px;font-size:14px;">📋</div>
      <div><div class="admin-title">ЗАЯВКИ</div><div style="font-size:10px;color:rgba(255,255,255,0.3);" id="orderCount">0 записей</div></div>
    </div>
    <button class="close-btn" onclick="closeAdmin()">✕</button>
  </div>
  <div class="admin-body" id="adminBody"></div>
</div>

<script>
const TG_TOKEN = "8855683460:AAGnPEgSHAY0Hg7dh88fp2qHTkuAtbiEYQs";
const TG_CHAT_ID = "7735557144";
const ADMIN_PASS = "gisa2025";
const STORAGE_KEY = "asktrain_orders";

const QUESTIONS = [
  "Как тебя зовут? 👋",
  "Отлично! Напиши свой номер телефона 📞",
  "Сколько тебе лет? 🎂",
  "Твой пол? (мужской / женский)",
  "Напиши свой вес и рост (например: 75 кг / 178 см) ⚖️",
  "Какая у тебя цель? (похудение, набор массы, рельеф, здоровье, выносливость...)",
  "Что тебя больше всего беспокоит или хочется улучшить? 💬",
  "Твой уровень физической подготовки? (новичок / средний / продвинутый) 🏋️",
  "Есть ли травмы или ограничения по здоровью? Если нет — напиши «нет» 🩹",
  "Сколько раз в неделю готов тренироваться и сколько времени? 📅"
];
const KEYS = ["name","phone","age","gender","body","goal","concerns","level","injuries","schedule"];
let step = 0, answers = {}, done = false;

function loadOrders() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]"); } catch { return []; } }
function saveOrder(o) { const a=loadOrders(); a.unshift(o); localStorage.setItem(STORAGE_KEY,JSON.stringify(a)); }

let tapCount=0, tapTimer;
document.getElementById('logoIcon').addEventListener('click',()=>{
  tapCount++; clearTimeout(tapTimer);
  tapTimer=setTimeout(()=>tapCount=0,2000);
  if(tapCount>=5){tapCount=0;openAdmin();}
});

let adminUnlocked=false;
function openAdmin(){document.getElementById('adminPanel').classList.add('open');if(!adminUnlocked)showPassScreen();else showOrders();}
function closeAdmin(){document.getElementById('adminPanel').classList.remove('open');}
function showPassScreen(){document.getElementById('adminBody').innerHTML=`<div class="pass-screen"><div style="font-size:40px">🔐</div><div style="color:rgba(255,255,255,0.4);font-size:14px;">Введи пароль тренера</div><input class="pass-input" type="password" id="passInput" placeholder="••••••••" onkeydown="if(event.key==='Enter')checkPass()"><button class="pass-btn" onclick="checkPass()">Войти</button><div class="pass-hint" id="passHint"></div></div>`;}
function checkPass(){const v=document.getElementById('passInput').value;if(v===ADMIN_PASS){adminUnlocked=true;showOrders();}else{document.getElementById('passHint').textContent='Неверный пароль';}}
function formatCard(o){return `📋 ЗАЯВКА — ASKTRAIN\n\nИмя: ${o.name}\nТелефон: ${o.phone}\nВозраст: ${o.age}\nПол: ${o.gender}\nВес/Рост: ${o.body}\nЦель: ${o.goal}\nПожелания: ${o.concerns}\nУровень: ${o.level}\nТравмы: ${o.injuries}\nГрафик: ${o.schedule}\n\n${new Date(o.ts).toLocaleString('ru-RU')}`;}
function showOrders(sel){
  const orders=loadOrders();
  document.getElementById('orderCount').textContent=orders.length+' записей';
  if(sel!==undefined){
    const o=orders[sel];
    document.getElementById('adminBody').innerHTML=`<button class="back-btn" onclick="showOrders()">‹ Назад</button><div class="order-detail">${formatCard(o)}</div><button onclick="deleteOrder(${sel})" style="margin-top:12px;width:100%;padding:12px;background:rgba(220,50,50,0.1);border:1px solid rgba(220,50,50,0.2);border-radius:12px;color:#f87171;cursor:pointer;font-size:14px;">🗑 Удалить</button>`;
    return;
  }
  if(orders.length===0){document.getElementById('adminBody').innerHTML='<div class="empty-state"><div style="font-size:44px;margin-bottom:12px">📭</div>Заявок пока нет</div>';return;}
  document.getElementById('adminBody').innerHTML=orders.map((o,i)=>`<div class="order-card" onclick="showOrders(${i})"><div class="order-name">${o.name||'Без имени'}</div><div class="order-meta">${o.phone||'—'} · ${new Date(o.ts).toLocaleDateString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div><div class="order-goal">🎯 ${o.goal||'—'}</div></div>`).join('');
}
function deleteOrder(i){const a=loadOrders();a.splice(i,1);localStorage.setItem(STORAGE_KEY,JSON.stringify(a));showOrders();}

function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,100)+'px';}

function addMsg(text,type){
  const msgs=document.getElementById('messages');
  const div=document.createElement('div');
  div.className='msg '+type;
  if(type==='user'){
    div.innerHTML=`<div class="msg-bubble">${text}</div><div class="msg-avatar user">👤</div>`;
  } else {
    div.innerHTML=`<div class="msg-avatar bot">⚡</div><div class="msg-bubble">${text}</div>`;
  }
  msgs.appendChild(div);
  msgs.scrollTop=msgs.scrollHeight;
}

function updateProgress(){
  document.getElementById('progress').style.width=(step/QUESTIONS.length*100)+'%';
  document.getElementById('statusText').textContent=done?'готово':step+'/10';
  if(done){document.getElementById('statusDot').style.background='#a78bfa';}
}

async function sendTelegram(text){try{await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:TG_CHAT_ID,text})});}catch(e){}}
async function sendNtfy(text){try{await fetch('https://ntfy.sh/asktrain-gisa',{method:'POST',body:text});}catch(e){}}

function playSound(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const o1=ctx.createOscillator(),g1=ctx.createGain();
    o1.connect(g1);g1.connect(ctx.destination);
    o1.frequency.setValueAtTime(600,ctx.currentTime);
    o1.frequency.exponentialRampToValueAtTime(1200,ctx.currentTime+0.1);
    g1.gain.setValueAtTime(0.12,ctx.currentTime);
    g1.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.2);
    o1.start();o1.stop(ctx.currentTime+0.2);
  }catch(e){}
}

function spawnParticles(x,y){
  const colors=['#a78bfa','#60a5fa','#c4b5fd','#93c5fd','#7c3aed','#3b82f6'];
  for(let i=0;i<10;i++){
    const p=document.createElement('div');
    p.className='particle';
    const angle=(360/10)*i+Math.random()*20;
    const dist=40+Math.random()*50;
    const rad=angle*Math.PI/180;
    const size=5+Math.random()*6;
    p.style.cssText=`left:${x-size/2}px;top:${y-size/2}px;width:${size}px;height:${size}px;background:${colors[Math.floor(Math.random()*colors.length)]};--tx:${Math.cos(rad)*dist}px;--ty:${Math.sin(rad)*dist}px;box-shadow:0 0 6px ${colors[0]};`;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),800);
  }
}

function sendWithParticles(e){
  const btn=document.getElementById('sendBtn');
  const rect=btn.getBoundingClientRect();
  spawnParticles(rect.left+rect.width/2,rect.top+rect.height/2);
  playSound();
  send();
}

async function send(){
  const input=document.getElementById('input');
  const text=input.value.trim();
  if(!text||done)return;
  input.value='';input.style.height='auto';
  addMsg(text,'user');
  answers[KEYS[step]]=text;
  step++;
  updateProgress();
  if(step<QUESTIONS.length){
    setTimeout(()=>addMsg(QUESTIONS[step],'bot'),300);
  } else {
    done=true;
    const order={...answers,ts:Date.now()};
    const cardText=formatCard(order);
    setTimeout(()=>addMsg(cardText,'card'),300);
    setTimeout(async()=>{
      addMsg('Заявка отправлена тренеру! Он свяжется с тобой в ближайшее время. 💪','bot');
      saveOrder(order);
      await sendNtfy(cardText);
      await sendTelegram('📋 НОВАЯ ЗАЯВКА — ASKTRAIN\n\n'+cardText);
    },600);
    document.getElementById('input').disabled=true;
    document.getElementById('input').placeholder='Заявка оформлена ✓';
    document.getElementById('sendBtn').disabled=true;
    updateProgress();
  }
}

document.getElementById('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});

addMsg('Привет! 💪 Я Asktrain — помощник по оформлению персональной программы тренировок.\n\nОтвечай на вопросы, и тренер составит план именно под тебя. Это займёт пару минут!','bot');
setTimeout(()=>addMsg(QUESTIONS[0],'bot'),400);
</script>
</body>
</html>
